# A ClusterIssuer that signs certificates using a self-signed CA.
# Self-signed is appropriate for a sandbox — no public DNS or ACME required.
#
# How it works:
#   1. cert-manager generates a self-signed CA certificate (the "sandbox-ca" Secret)
#   2. The CA ClusterIssuer signs workload certificates using that CA
#   3. Services that need TLS (e.g. Grafana) reference this issuer in a Certificate resource
#
# sync-wave: "5" — applied after cert-manager CRDs and webhook are Healthy.
# ArgoCD holds wave-5 resources until all wave-0 (default) resources are Healthy.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-root
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sandbox-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  isCA: true
  commonName: sandbox-ca
  secretName: sandbox-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-root
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: sandbox-ca
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  ca:
    secretName: sandbox-ca-secret
