apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# cert-manager installs:
#   - CRDs (Certificate, Issuer, ClusterIssuer, CertificateRequest, etc.)
#   - cert-manager controller Deployment
#   - webhook Deployment + ValidatingWebhookConfiguration
#   - cainjector Deployment
#
# The remote URL pulls the official all-in-one install manifest from GitHub.
# Update the version tag to keep current:
#   https://github.com/cert-manager/cert-manager/releases
#
# sync-wave ordering within this app:
#   wave 0 (default): cert-manager Deployments + CRDs  (from remote URL)
#   wave 5:           ClusterIssuer                    (needs webhook running)
#
# Why wave 5 for ClusterIssuer? ArgoCD sync waves are per-resource within an app.
# ArgoCD waits for wave-0 resources to be Healthy (cert-manager webhook pod Ready)
# before applying wave-5 resources. Without this ordering, the ClusterIssuer would
# be rejected by the webhook that isn't running yet.
resources:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.16.0/cert-manager.yaml
  - cluster-issuer.yaml
