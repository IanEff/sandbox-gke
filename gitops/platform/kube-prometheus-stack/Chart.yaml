apiVersion: v2
name: kube-prometheus-stack
description: Umbrella chart — pulls kube-prometheus-stack from prometheus-community.
version: 0.1.0
# ArgoCD runs `helm dependency update` on this directory before rendering,
# fetching the chart from the repository below. No tarballs are vendored.
# To upgrade: bump the version here and commit.
# Latest releases: https://github.com/prometheus-community/helm-charts/releases
dependencies:
  - name: kube-prometheus-stack
    version: "65.1.1"
    repository: https://prometheus-community.github.io/helm-charts
