apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

# The root Application syncs this directory. Each ApplicationSet here generates
# child Applications by scanning its tier's config.json files.
#
# Sync-wave annotations on each ApplicationSet enforce tier ordering:
#   infra (wave 0) → platform (wave 1) → apps (wave 2)
#
# ArgoCD waits for each wave to reach Healthy before starting the next,
# so cert-manager CRDs land before Prometheus tries to install ServiceMonitor CRDs,
# and so on.
resources:
  - infra-set.yaml
  - platform-set.yaml
  - apps-set.yaml
